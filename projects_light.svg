        <rect width="340" height="130" rx="16" fill="none" stroke="rgba(15,23,42,.08)" stroke-width="1.5"/>
        <rect width="340" height="130" rx="16" fill="none" stroke="url(#borderShimmer)" stroke-width="2">
          <animate attributeName="opacity" values="0.3;1;0.3" dur="4.0s" repeatCount="indefinite"/>
        </rect>
        
        <!-- Icon -->
        <text x="20" y="45" font-size="28">🛫</text>
        
        <!-- Title -->
        <text x="65" y="42" font-family="-apple-system, sans-serif" font-size="20" font-weight="700" fill="#0F172A">AeroMind</text>
        
        <!-- Desc -->
        <text x="20" y="70" font-family="-apple-system, sans-serif" font-size="13.5" fill="#475569">
