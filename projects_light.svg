<svg width="1180" height="380" viewBox="0 0 1180 380" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgBase" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#FFFFFF"/>
    </linearGradient>

    <linearGradient id="borderShimmer" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563EB" stop-opacity="0.1"/>
      <stop offset="45%" stop-color="#06B6D4" stop-opacity="0.1"/>
      <stop offset="50%" stop-color="#06B6D4" stop-opacity="0.8"/>
      <stop offset="55%" stop-color="#10B981" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#10B981" stop-opacity="0.1"/>
      <animateTransform attributeName="gradientTransform" type="translate"
                          values="-1180 0; 1180 0; -1180 0" dur="6s" repeatCount="indefinite"/>
    </linearGradient>
    
    <linearGradient id="glassSheen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.10"/>
      <stop offset="18%" stop-color="#000000" stop-opacity="0.03"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </linearGradient>
    
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1180" height="380" fill="#FFFFFF" rx="20"/>

  <g transform="translate(40, 40)">

