<svg width="1180" height="80" viewBox="0 0 1180 80" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgBase" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#FFFFFF"/>
    </linearGradient>

    <linearGradient id="barGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563EB" stop-opacity="0.15"/>
      <stop offset="30%" stop-color="#06B6D4" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="50%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#10B981"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-1180 0; 1180 0; -1180 0" dur="4s" repeatCount="indefinite"/>
    </linearGradient>
    
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <g transform="translate(60, 10)">
    <!-- Glass panel -->
    <rect width="1060" height="60" rx="12" fill="#F8FAFC" opacity="0.6"/>
    <rect width="1060" height="60" rx="12" fill="url(#barGrad)"/>
    
    <!-- Glowing Left Accent -->
    <rect x="0" y="0" width="6" height="60" rx="3" fill="url(#lineGrad)" filter="url(#glow)"/>
    
    <!-- Title Text -->
    <text x="30" y="38" font-family="-apple-system, sans-serif" font-size="22" font-weight="800" letter-spacing="2" fill="#0F172A">06 — EXPERIENCE & EDUCATION</text>
    
    <!-- Subtle tech decoration -->
    <circle cx="1020" cy="30" r="3" fill="#06B6D4" opacity="0.5">
        <animate attributeName="opacity" values="0.2;1;0.2" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1035" cy="30" r="3" fill="#10B981" opacity="0.5">
        <animate attributeName="opacity" values="0.2;1;0.2" dur="2s" begin="0.5s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>