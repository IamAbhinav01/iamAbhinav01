<svg width="400" height="150" viewBox="0 0 400 150" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgBase" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#030712"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>

    <linearGradient id="borderShimmer" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7C3AED" stop-opacity="0.1"/>
      <stop offset="45%" stop-color="#22D3EE" stop-opacity="0.1"/>
      <stop offset="50%" stop-color="#22D3EE" stop-opacity="0.9"/>
      <stop offset="55%" stop-color="#10B981" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#10B981" stop-opacity="0.1"/>
      <animateTransform attributeName="gradientTransform" type="translate"
                          values="-400 0; 400 0; -400 0" dur="4s" repeatCount="indefinite"/>
    </linearGradient>
    
    <linearGradient id="glassSheen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.10"/>
      <stop offset="18%" stop-color="#FFFFFF" stop-opacity="0.03"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <g>
    <rect width="400" height="150" rx="16" fill="#0F172A" fill-opacity="0.8"/>
    <rect width="400" height="150" rx="16" fill="url(#glassSheen)"/>
    <rect width="400" height="150" rx="16" fill="none" stroke="rgba(255,255,255,.08)" stroke-width="1.5"/>
    <rect width="400" height="150" rx="16" fill="none" stroke="url(#borderShimmer)" stroke-width="2">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="3.4s" repeatCount="indefinite"/>
    </rect>
    
    <!-- Icon -->
    <text x="24" y="50" font-size="32">🤖</text>
    
    <!-- Title -->
    <text x="75" y="47" font-family="-apple-system, sans-serif" font-size="22" font-weight="700" fill="#F8FAFC">coderX</text>
    
    <!-- Desc -->
    <text x="24" y="80" font-family="-apple-system, sans-serif" font-size="14" fill="#94A3B8">
        <tspan x="24" dy="0">6 svc · LLM judge</tspan>
        <tspan x="24" dy="20">Dockerode sandbox · BullMQ</tspan>
        <tspan x="24" dy="20"></tspan>
    </text>
  </g>
</svg>